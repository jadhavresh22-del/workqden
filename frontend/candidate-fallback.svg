<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="userBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="userAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" fill="url(#userBgGrad)"/>
  <rect x="1" y="1" width="398" height="238" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle glow -->
  <circle cx="200" cy="95" r="56" fill="#334155" fill-opacity="0.3"/>

  <!-- User Avatar Vector -->
  <g transform="translate(170, 48)" fill="none" stroke="url(#userAccentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="30" cy="22" r="16" fill="#1E293B"/>
    <path d="M6 56 C6 42 16 38 30 38 C44 38 54 42 54 56" fill="#1E293B"/>
  </g>

  <!-- Labels -->
  <text x="200" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">WORQDEN CANDIDATE</text>
  <text x="200" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1">HOSPITALITY PROFESSIONAL</text>
  
  <!-- Accent bottom stripe -->
  <rect x="160" y="200" width="80" height="3" rx="1.5" fill="url(#userAccentGrad)"/>
</svg>
