<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorqDen — Reset Password</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body class="auth-body">

    <!-- Auth Header -->
    <header class="main-header">
        <a href="index.html" class="logo">
            <svg class="logo-svg-mark" viewBox="0 0 64 64" width="34" height="34" style="flex-shrink:0;">
                <defs>
                    <linearGradient id="wqLogoFp" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#F97316"/>
                        <stop offset="100%" stop-color="#10B981"/>
                    </linearGradient>
                </defs>
                <rect width="64" height="64" rx="16" fill="#0F172A"/>
                <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#wqLogoFp)" stroke-width="2.5"/>
                <path d="M16 22 L24 44 L32 28 L40 44 L48 22" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="32" cy="18" r="4" fill="#F97316"/>
            </svg>
            <span style="font-size: 21px; font-weight: 800; color: #FFFFFF;">Worq<span style="color: #F97316;">Den</span></span>
        </a>
        <nav class="nav-links">
            <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
                <span class="theme-icon">🌙</span><span class="theme-text">Dark Mode</span>
            </button>
            <a href="login.html">Back to Login</a>
            <a href="admin.html" style="color: #FCD34D;">🛡️ Admin</a>
        </nav>
    </header>

    <main class="auth-page-container">
        <div class="auth-card-single" style="max-width: 480px; margin: 0 auto;">
            <div class="auth-header-compact">
                <span class="auth-tag-badge">ACCOUNT RECOVERY</span>
                <h1 class="auth-heading-h2">Reset Password</h1>
                <p class="auth-subtitle" id="stepDescription">Enter your registered email address or mobile number to receive a 6-digit OTP code.</p>
            </div>

            <!-- Step 1: Request OTP -->
            <form id="requestOtpForm" onsubmit="handleRequestResetOtp(event)">
                <div class="form-group">
                    <label for="recoveryIdentifier">Registered Email or Phone Number *</label>
                    <input type="text" id="recoveryIdentifier" class="form-input" placeholder="e.g. name@example.com or 9876543210" required>
                </div>

                <div id="step1Error" class="form-error-banner hidden"></div>
                <div id="step1Success" class="form-success-banner hidden"></div>

                <button type="submit" id="requestOtpBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: 14px;">
                    <span>Send Verification Code &rarr;</span>
                </button>
            </form>

            <!-- Step 2: Enter OTP & New Password -->
            <form id="resetPasswordForm" class="hidden" onsubmit="handleFinalResetPassword(event)">
                <div id="devOtpBanner" class="dev-otp-banner hidden" style="margin-bottom: 16px;">
                    🔑 <strong>Test Mode OTP:</strong> <span id="devOtpDisplay"></span>
                </div>

                <div class="form-group">
                    <label for="otpCode">6-Digit Verification Code *</label>
                    <input type="text" id="otpCode" class="form-input" placeholder="123456" maxlength="6" style="letter-spacing: 4px; font-size: 18px; font-weight: 700; text-align: center;" required>
                    <span class="form-hint" id="otpTargetNotice" style="font-size: 12px; color: var(--text-muted); display: block; margin-top: 4px;"></span>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password * (min. 6 characters)</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="••••••••" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password *</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" minlength="6" required>
                </div>

                <div id="step2Error" class="form-error-banner hidden"></div>
                <div id="step2Success" class="form-success-banner hidden"></div>

                <button type="submit" id="resetPasswordBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: 14px;">
                    <span>Update Password ✓</span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <p style="font-size: 13.5px; color: var(--text-muted);">
                    Remember your password? <a href="login.html" style="font-weight: 600; color: var(--primary-blue);">Login here</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        let cachedIdentifier = '';

        async function handleRequestResetOtp(e) {
            e.preventDefault();
            const identifier = document.getElementById('recoveryIdentifier').value.trim();
            const errBox = document.getElementById('step1Error');
            const succBox = document.getElementById('step1Success');
            const btn = document.getElementById('requestOtpBtn');

            errBox.classList.add('hidden');
            succBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = 'Sending Code... ⏳';

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier })
                });
                const data = await res.json();

                if (res.ok) {
                    cachedIdentifier = identifier;
                    document.getElementById('requestOtpForm').classList.add('hidden');
                    document.getElementById('resetPasswordForm').classList.remove('hidden');
                    document.getElementById('stepDescription').textContent = 'Enter the 6-digit verification code and choose a new password.';

                    if (data.devOtp) {
                        document.getElementById('devOtpDisplay').textContent = data.devOtp;
                        document.getElementById('devOtpBanner').classList.remove('hidden');
                        document.getElementById('otpCode').value = data.devOtp;
                    }

                    if (data.maskedPhone) {
                        document.getElementById('otpTargetNotice').textContent = `Verification code dispatched to ${data.maskedEmail || identifier} and +91 ${data.maskedPhone}`;
                    } else {
                        document.getElementById('otpTargetNotice').textContent = `Verification code sent to ${data.maskedEmail || identifier}`;
                    }
                } else {
                    errBox.textContent = data.message || 'Failed to process request.';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.textContent = 'Connection error. Please try again.';
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Send Verification Code &rarr;';
            }
        }

        async function handleFinalResetPassword(e) {
            e.preventDefault();
            const otp = document.getElementById('otpCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errBox = document.getElementById('step2Error');
            const succBox = document.getElementById('step2Success');
            const btn = document.getElementById('resetPasswordBtn');

            errBox.classList.add('hidden');
            succBox.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                errBox.textContent = 'Passwords do not match.';
                errBox.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Updating Password... ⏳';

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier: cachedIdentifier, otp, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    succBox.textContent = 'Password reset successfully! Redirecting to login... 🎉';
                    succBox.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    errBox.textContent = data.message || 'Failed to reset password.';
                    errBox.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = 'Update Password ✓';
                }
            } catch (err) {
                errBox.textContent = 'Connection error. Please try again.';
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Update Password ✓';
            }
        }
    </script>
</body>
</html>
