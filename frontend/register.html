<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorqDen - Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="register-page">

<header class="main-header">

    <div class="logo">WorqDen</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>

</header>


<main class="register-wrapper">

    <div class="register-card">

        <div class="register-heading">

            <span class="form-badge">JOIN WORQDEN</span>

            <h1>Create your account</h1>

            <p>
                Connect with workers, students and organizations
                for flexible work opportunities.
            </p>

        </div>


        <form id="registerForm">

            <h3 class="form-section-title">
                Account Type
            </h3>

            <div class="form-group">

                <label for="userType">
                    Register as
                </label>

                <select id="userType" required>

                    <option value="">
                        Select account type
                    </option>

                    <option value="staff">
                        Worker / Professional
                    </option>

                    <option value="student">
                        Student
                    </option>

                    <option value="hotel">
                        Hotel / Organization
                    </option>

                </select>

            </div>


            <div id="workerFields">

                <h3 class="form-section-title">
                    Work Information
                </h3>


                <div class="form-row">

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select id="category">

                            <option value="">
                                Select category
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="subcategory">
                            Subcategory
                        </label>

                        <select id="subcategory">

                            <option value="">
                                Select subcategory
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="experience">
                            Experience Level
                        </label>

                        <select id="experience">

                            <option value="">
                                Select experience
                            </option>

                            <option value="Fresher">
                                Fresher
                            </option>

                            <option value="Beginner">
                                Beginner
                            </option>

                            <option value="Intermediate">
                                Intermediate
                            </option>

                            <option value="Experienced">
                                Experienced
                            </option>

                            <option value="Professional">
                                Professional
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="availability">
                            Availability
                        </label>

                        <select id="availability">

                            <option value="">
                                Select availability
                            </option>

                            <option value="Available now">
                                Available now
                            </option>

                            <option value="Part time">
                                Part time
                            </option>

                            <option value="Full time">
                                Full time
                            </option>

                            <option value="Weekends">
                                Weekends
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <h3 class="form-section-title">
                Personal Information
            </h3>


            <div class="form-row">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div id="locationFields">

                <h3 class="form-section-title">
                    Location
                </h3>

                <div class="form-row">

                    <div class="form-group">

                        <label for="state">
                            State
                        </label>

                        <select id="state">

                            <option value="">
                                Select state
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="district">
                            District
                        </label>

                        <select id="district">

                            <option value="">
                                Select district
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <div id="studentFields" class="hidden">

                <h3 class="form-section-title">
                    Student Information
                </h3>

                <div class="form-group">

                    <label for="studentSkill">
                        Skills / Interests
                    </label>

                    <input
                        type="text"
                        id="studentSkill"
                        placeholder="Example: Python, Design, Photography"
                    >

                </div>

            </div>


            <div id="hotelFields" class="hidden">

                <h3 class="form-section-title">
                    Organization Information
                </h3>

                <div class="form-row">

                    <div class="form-group">

                        <label for="organizationName">
                            Organization Name
                        </label>

                        <input
                            type="text"
                            id="organizationName"
                            placeholder="Hotel / organization name"
                        >

                    </div>


                    <div class="form-group">

                        <label for="organizationType">
                            Organization Type
                        </label>

                        <select id="organizationType">

                            <option value="">
                                Select type
                            </option>

                            <option value="Hotel">
                                Hotel
                            </option>

                            <option value="Restaurant">
                                Restaurant
                            </option>

                            <option value="Event Management">
                                Event Management
                            </option>

                            <option value="Business">
                                Business / Company
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <div class="form-group">

                <label for="about">
                    About
                </label>

                <textarea
                    id="about"
                    placeholder="Tell us a little about yourself or your organization"
                    rows="4"
                ></textarea>

            </div>


            <button
                type="submit"
                class="create-account-btn">

                Create Account

            </button>


        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</main>


<script>

    "Kerala": ["Thiruvananthapuram", "Kollam", "Ernakulam", "Kozhikode", "Thrissur", "Alappuzha", "Kannur", "Kottayam", "Palakkad", "Malappuram", "Wayanad", "Idukki"],

    "Rajasthan": ["Jaipur", "Jodhpur", "Udaipur", "Kota", "Bikaner", "Ajmer", "Alwar", "Bharatpur", "Sikar", "Bhilwara"],

    "Sikkim": ["East Sikkim", "West Sikkim", "North Sikkim", "South Sikkim"],

    "Uttarakhand": ["Dehradun", "Haridwar", "Nainital", "Udham Singh Nagar", "Almora", "Pauri Garhwal"],

    "West Bengal": ["Kolkata", "North 24 Parganas", "South 24 Parganas", "Howrah", "Hooghly", "Nadia", "Darjeeling", "Purba Bardhaman", "Malda"],

    "Andaman and Nicobar Islands": ["South Andaman", "North and Middle Andaman", "Nicobar"],

    "Chandigarh": ["Chandigarh"],

    "Dadra and Nagar Haveli and Daman and Diu": ["Dadra and Nagar Haveli", "Daman", "Diu"],

    "Delhi": ["New Delhi", "North Delhi", "South Delhi", "East Delhi", "West Delhi", "Central Delhi", "North East Delhi", "North West Delhi", "South East Delhi", "South West Delhi", "Shahdara"],

    "Jammu and Kashmir": ["Srinagar", "Jammu", "Baramulla", "Anantnag", "Udhampur", "Kathua", "Pulwama"],

    "Ladakh": ["Leh", "Kargil"],

    "Lakshadweep": ["Lakshadweep"],

    "Puducherry": ["Puducherry", "Karaikal", "Mahe", "Yanam"]

};


const categories = {

    "Hospitality & Hotels": [
        "Waiter",
        "Chef",
        "Cook",
        "Kitchen Helper",
        "Housekeeping",
        "Receptionist",
        "Steward"
    ],

    "Events": [
        "Event Helper",
        "Catering Staff",
        "Event Coordinator",
        "Decoration Worker",
        "Photographer",
        "Videographer",
        "Sound Technician"
    ],

    "Home Services": [
        "Plumber",
        "Electrician",
        "Carpenter",
        "Painter",
        "Cleaner",
        "AC Technician",
        "Appliance Repair"
    ],

    "Construction": [
        "Mason",
        "Welder",
        "Carpenter",
        "Painter",
        "Electrician",
        "Plumber"
    ],

    "Transportation": [
        "Driver",
        "Delivery Partner",
        "Loader",
        "Travel Assistant",
        "Transport Helper"
    ],

    "Beauty & Personal Care": [
        "Hair Stylist",
        "Makeup Artist",
        "Beautician",
        "Mehendi Artist",
        "Nail Artist"
    ],

    "Education": [
        "Tutor",
        "Teaching Assistant",
        "Subject Expert",
        "Academic Support"
    ],

    "Office & Business": [
        "Data Entry",
        "Receptionist",
        "Office Assistant",
        "Sales Executive",
        "Customer Support"
    ],

    "Healthcare": [
        "Caretaker",
        "Nursing Assistant",
        "Home Care Worker",
        "Medical Support"
    ],

    "Technology": [
        "Web Developer",
        "Graphic Designer",
        "Video Editor",
        "IT Support",
        "Social Media Manager"
    ],

    "Retail": [
        "Store Assistant",
        "Cashier",
        "Sales Staff",
        "Stock Assistant"
    ],

    "Cleaning & Maintenance": [
        "House Cleaner",
        "Office Cleaner",
        "Gardener",
        "Maintenance Worker"
    ],

    "Security": [
        "Security Guard",
        "Event Security",
        "Night Guard"
    ],

    "Agriculture": [
        "Farm Worker",
        "Gardener",
        "Harvest Worker",
        "Livestock Assistant"
    ]

};


const userType =
    document.getElementById("userType");

const category =
    document.getElementById("category");

const subcategory =
    document.getElementById("subcategory");

const workerFields =
    document.getElementById("workerFields");

const studentFields =
    document.getElementById("studentFields");

const hotelFields =
    document.getElementById("hotelFields");

const stateSelect =
    document.getElementById("state");

const districtSelect =
    document.getElementById("district");


/* STATE LIST */

Object.keys(statesDistricts).forEach(function(name) {

    const option =
        document.createElement("option");

    option.value = name;
    option.textContent = name;

    stateSelect.appendChild(option);

});


/* DISTRICT (based on selected state) */

stateSelect.addEventListener("change", function() {

    districtSelect.innerHTML =
        '<option value="">Select district</option>';

    const selected =
        statesDistricts[stateSelect.value] || [];

    selected.forEach(function(name) {

        const option =
            document.createElement("option");

        option.value = name;
        option.textContent = name;

        districtSelect.appendChild(option);

    });

});


/* CATEGORY LIST */

Object.keys(categories).forEach(function(name) {

    const option =
        document.createElement("option");

    option.value = name;
    option.textContent = name;

    category.appendChild(option);

});


/* SUBCATEGORY */

category.addEventListener("change", function() {

    subcategory.innerHTML =
        '<option value="">Select subcategory</option>';

    const selected =
        categories[category.value] || [];

    selected.forEach(function(name) {

        const option =
            document.createElement("option");

        option.value = name;
        option.textContent = name;

        subcategory.appendChild(option);

    });

});


/* USER TYPE */

userType.addEventListener("change", function() {

    workerFields.classList.add("hidden");
    studentFields.classList.add("hidden");
    hotelFields.classList.add("hidden");

    if (
        userType.value === "staff" ||
        userType.value === "student"
    ) {

        workerFields.classList.remove("hidden");

    }


    if (userType.value === "student") {

        studentFields.classList.remove("hidden");

    }


    if (userType.value === "hotel") {

        hotelFields.classList.remove("hidden");

    }

});


/* REGISTER */

document
    .getElementById("registerForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const skillsValue =
            document.getElementById("studentSkill").value
            .split(",")
            .map(skill => skill.trim())
            .filter(skill => skill);


        const userData = {

            userType:
                userType.value,

            name:
                document.getElementById("name").value.trim(),

            email:
                document.getElementById("email").value.trim(),

            phone:
                document.getElementById("phone").value.trim(),

            password:
                document.getElementById("password").value,

            state:
                document.getElementById("state").value.trim(),

            district:
                document.getElementById("district").value.trim(),

            category:
                category.value,

            subcategory:
                subcategory.value,

            experience:
                document.getElementById("experience").value,

            skills:
                skillsValue,

            availability:
                document.getElementById("availability").value,

            about:
                document.getElementById("about").value.trim(),

            organizationName:
                document.getElementById("organizationName").value.trim(),

            organizationType:
                document.getElementById("organizationType").value

        };


        try {

            const response =
                await fetch(
                    "/api/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(userData)
                    }
                );


            const data =
                await response.json();


            if (response.ok) {

                alert(
                    "Registration successful!"
                );

                document
                    .getElementById("registerForm")
                    .reset();

                category.value = "";

                subcategory.innerHTML =
                    '<option value="">Select subcategory</option>';

                workerFields.classList.add("hidden");
                studentFields.classList.add("hidden");
                hotelFields.classList.add("hidden");

            }

            else {

                alert(
                    data.message ||
                    "Registration failed."
                );

            }

        }

        catch (error) {

            console.error(error);

            alert(
                "Unable to connect to WorqDen server."
            );

        }

    });

</script>

</body>
</html>
